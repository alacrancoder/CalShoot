[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calshoot"
version = "0.1.0"
description = "One-way calendar sync from TimeTree to Google Calendar"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
calshoot = "calshoot.cli:main"

[tool.setuptools.packages.find]
include = ["calshoot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
